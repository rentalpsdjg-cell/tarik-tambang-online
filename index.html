<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tarik Tambang Pro + Upload Soal</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Fredoka:wght@600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; font-family: 'Fredoka', sans-serif; background: #0f172a; }
    
    /* MENU LOBBY PRO */
    #main-menu { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%); padding: 20px; overflow-y: auto; }
    .lobby-card { background: rgba(30, 41, 59, 0.95); border: 3px solid #fbbf24; border-radius: 28px; padding: 22px 18px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .game-logo { font-family: 'Titan One', cursive; font-size: 22px; color: #f59e0b; text-shadow: 2px 2px 0px #78350f, -2px -2px 0 #000; margin-bottom: 12px; }
    .input-room { width: 100%; padding: 12px; border-radius: 14px; border: 3px solid #6366f1; font-size: 18px; text-align: center; font-weight: 700; background: #1e293b; color: #fff; outline: none; margin-bottom: 12px; }
    .team-select { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-team { flex: 1; padding: 10px; border-radius: 14px; border: 3px solid transparent; font-family: 'Titan One', cursive; font-size: 13px; color: #fff; cursor: pointer; opacity: 0.5; transition: 0.2s; }
    .btn-team.active { opacity: 1; border-color: #fff; transform: scale(1.05); }
    .team-1 { background: linear-gradient(180deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 0 #1e40af; }
    .team-2 { background: linear-gradient(180deg, #ef4444, #b91c1c); box-shadow: 0 4px 0 #991b1b; }
    
    .btn-play { width: 100%; padding: 14px; border: none; border-radius: 16px; background: linear-gradient(180deg, #22c55e, #15803d); color: #fff; font-family: 'Titan One', cursive; font-size: 16px; text-shadow: 1px 2px 0 #000; box-shadow: 0 5px 0 #166534; cursor: pointer; margin-bottom: 10px; }
    .btn-play:active { transform: translateY(4px); box-shadow: 0 1px 0 #166534; }
    
    .btn-admin-toggle { background: transparent; border: none; color: #94a3b8; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 5px; }

    /* PANEL UPLOAD / TAMBAH SOAL OTOMATIS */
    #admin-panel { display: none; margin-top: 15px; border-top: 2px dashed rgba(255,255,255,0.15); padding-top: 15px; text-align: left; }
    .admin-title { font-size: 13px; color: #fbbf24; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .input-admin { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; font-size: 12px; background: #0f172a; color: #fff; margin-bottom: 6px; outline: none; }
    .btn-upload { width: 100%; padding: 10px; border: none; border-radius: 10px; background: #3b82f6; color: white; font-weight: 700; font-size: 12px; cursor: pointer; }

    /* LAYOUT GAME MOBILE ARENA */
    #game-container { display: none; flex-direction: column; width: 100vw; height: 100dvh; background: linear-gradient(180deg, #0284c7 0%, #0f172a 100%); justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 12px max(15px, env(safe-area-inset-bottom)) 12px; }

    /* TOP BAR STATS */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); padding: 8px 15px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1); }
    .room-badge { font-weight: 700; color: #93c5fd; font-size: 12px; }
    .timer-badge { font-family: 'Titan One', cursive; color: #f87171; background: #450a0a; padding: 4px 12px; border-radius: 12px; border: 2px solid #ef4444; font-size: 14px; }

    /* STADIUM ARENA */
    .stadium { background: linear-gradient(180deg, #15803d 0%, #166534 100%); border: 4px solid #fbbf24; border-radius: 24px; height: 100px; position: relative; display: flex; align-items: center; overflow: hidden; box-shadow: inset 0 6px 12px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.3); margin: 8px 0; }
    .center-line { position: absolute; left: 50%; width: 6px; height: 100%; background: #ffffff; transform: translateX(-50%); opacity: 0.8; border-right: 2px dashed #000; z-index: 1; }
    
    #rope-group { position: absolute; left: 50%; width: 220px; height: 100%; display: flex; align-items: center; justify-content: space-between; transform: translateX(-50%); transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2; }
    .rope { position: absolute; width: 100%; height: 8px; background: #d97706; border: 2px solid #78350f; border-radius: 4px; top: 50%; transform: translateY(-50%); z-index: -1; }
    .ribbon { position: absolute; left: 50%; width: 14px; height: 26px; background: #ef4444; border: 2px solid #fff; border-radius: 4px; transform: translateX(-50%); z-index: 3; }

    .avatar-box { width: 50px; height: 50px; background: #fff; border-radius: 50%; border: 3px solid #fbbf24; box-shadow: 0 4px 8px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .char-flip { transform: scaleX(-1); }

    /* QUESTION CARD */
    .question-card { background: rgba(30, 41, 59, 0.95); border: 2px solid #6366f1; border-radius: 18px; padding: 12px; text-align: center; flex: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px rgba(0,0,0,0.3); margin-bottom: 8px; }
    .question-text { color: #ffffff; font-size: 14px; font-weight: 700; line-height: 1.3; }

    /* 4 OPTION BUTTONS JUMBO */
    .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 170px; }
    .btn-ans { border: none; border-radius: 16px; padding: 10px; font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 700; color: white; display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; transition: 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    .btn-ans:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    .badge-letter { font-family: 'Titan One', cursive; background: rgba(0,0,0,0.25); width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    
    .ans-naruto { background: linear-gradient(180deg, #3b82f6, #1d4ed8); border: 2px solid #60a5fa; box-shadow: 0 4px 0 #1e3a8a; }
    .ans-sasuke { background: linear-gradient(180deg, #ef4444, #dc2626); border: 2px solid #f87171; box-shadow: 0 4px 0 #7f1d1d; }

    /* OVERLAY HASIL */
    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 200; display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    .win-card { background: #1e293b; border: 4px solid #fbbf24; border-radius: 28px; padding: 25px 20px; text-align: center; width: 100%; max-width: 320px; }
    .win-title { font-family: 'Titan One', cursive; font-size: 20px; color: #fbbf24; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- LOBBY MAIN MENU -->
  <div id="main-menu">
    <div class="lobby-card">
      <div class="game-logo">⚔️ TARIK TAMBANG ⚔️</div>
      <input type="number" id="room-code" class="input-room" placeholder="KODE ROOM (cth: 8888)">
      
      <div class="team-select">
        <button id="btn-t1" class="btn-team team-1 active" onclick="pilihTim(1)">NARUTO</button>
        <button id="btn-t2" class="btn-team team-2" onclick="pilihTim(2)">SASUKE</button>
      </div>

      <button class="btn-play" onclick="gabungRoom()">MAIN SEKARANG 🚀</button>
      
      <button class="btn-admin-toggle" onclick="toggleAdminPanel()">⚙️ Menu Upload Soal Otomatis</button>

      <!-- PANEL UPLOAD SOAL KE DATABASE -->
      <div id="admin-panel">
        <div class="admin-title">Tambah Soal ke Database</div>
        <input type="text" id="in-soal" class="input-admin" placeholder="Pertanyaan...">
        <input type="text" id="in-o0" class="input-admin" placeholder="Opsi A">
        <input type="text" id="in-o1" class="input-admin" placeholder="Opsi B">
        <input type="text" id="in-o2" class="input-admin" placeholder="Opsi C">
        <input type="text" id="in-o3" class="input-admin" placeholder="Opsi D">
        <input type="number" id="in-benar" class="input-admin" placeholder="Jawaban Benar (0=A, 1=B, 2=C, 3=D)">
        <button class="btn-upload" onclick="uploadSoalBaru()">📤 Upload Soal ke Cloud</button>
      </div>
    </div>
  </div>

  <!-- GAME ARENA MAIN -->
  <div id="game-container">
    <div class="top-bar">
      <div class="room-badge">ROOM: <span id="lbl-room" style="color:#fff;">-</span> | TIM: <span id="lbl-tim" style="color:#60a5fa;">NARUTO</span></div>
      <div id="waktu" class="timer-badge">10:00</div>
    </div>

    <!-- STADIUM ARENA -->
    <div class="stadium">
      <div class="center-line"></div>
      <div id="rope-group">
        <div class="avatar-box"><img src="https://img.icons8.com/color/144/naruto.png" alt="Naruto"></div>
        <div class="rope"></div>
        <div class="ribbon"></div>
        <div class="avatar-box"><img src="https://img.icons8.com/color/144/sasuke-uchiha.png" class="char-flip" alt="Sasuke"></div>
      </div>
    </div>

    <!-- KOTAK SOAL -->
    <div class="question-card">
      <p id="teks-soal" class="question-text">Memuat Pertanyaan dari Server...</p>
    </div>

    <!-- TOMBOL JAWABAN HD -->
    <div class="answers-grid">
      <button class="btn-ans ans-naruto" onclick="jawab(0)"><span class="badge-letter">A</span><span id="opt0">-</span></button>
      <button class="btn-ans ans-naruto" onclick="jawab(1)"><span class="badge-letter">B</span><span id="opt1">-</span></button>
      <button class="btn-ans ans-naruto" onclick="jawab(2)"><span class="badge-letter">C</span><span id="opt2">-</span></button>
      <button class="btn-ans ans-naruto" onclick="jawab(3)"><span class="badge-letter">D</span><span id="opt3">-</span></button>
    </div>
  </div>

  <!-- OVERLAY MENANG -->
  <div id="overlay-menang" class="overlay">
    <div class="win-card">
      <div id="teks-menang" class="win-title">TIM NARUTO MENANG!</div>
      <button class="btn-play" onclick="window.location.reload()">MAIN LAGI 🏠</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6qWcP-732y2gdeUpVAuc50wEzRUYvZog",
      authDomain: "tarik-tambang-all-in.firebaseapp.com",
      databaseURL: "https://tarik-tambang-all-in-default-rtdb.firebaseio.com",
      projectId: "tarik-tambang-all-in",
      storageBucket: "tarik-tambang-all-in.firebasestorage.app",
      messagingSenderId: "926072529297",
      appId: "1:926072529297:web:b5b867cbb7072c91723a30"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let daftarSoal = [];
    let roomID = "";
    let timSaya = 1;
    let roomRef = null;
    let idxSoal = 0;

    // Ambil soal otomatis dari Firebase saat halaman dibuka
    function ambilSoalDariCloud() {
      db.ref('bankSoal').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          daftarSoal = Object.values(data);
          if (daftarSoal.length > 0 && document.getElementById('game-container').style.display === 'flex') {
            tampilkanSoal();
          }
        } else {
          // Fallback jika database masih kosong
          daftarSoal = [
            { soal: "Berapakah hasil dari 15 + 25?", opsi: ["30", "35", "40", "45"], jawaban: 2 },
            { soal: "Ibu kota negara Indonesia saat ini adalah...", opsi: ["Jakarta", "Nusantara", "Bandung", "Surabaya"], jawaban: 1 }
          ];
        }
      });
    }
    ambilSoalDariCloud();

    function toggleAdminPanel() {
      let panel = document.getElementById('admin-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function uploadSoalBaru() {
      let s = document.getElementById('in-soal').value.trim();
      let o0 = document.getElementById('in-o0').value.trim();
      let o1 = document.getElementById('in-o1').value.trim();
      let o2 = document.getElementById('in-o2').value.trim();
      let o3 = document.getElementById('in-o3').value.trim();
      let j = parseInt(document.getElementById('in-benar').value);

      if(!s || !o0 || !o1 || isNaN(j)) {
        alert("Mohon isi soal, minimal 2 opsi, dan nomor jawaban benar (0-3)!");
        return;
      }

      let soalBaru = { soal: s, opsi: [o0, o1, o2, o3], jawaban: j };
      db.ref('bankSoal').push(soalBaru).then(() => {
        alert("✅ Soal berhasil di-upload otomatis ke server!");
        document.getElementById('in-soal').value = '';
        document.getElementById('in-o0').value = '';
        document.getElementById('in-o1').value = '';
        document.getElementById('in-o2').value = '';
        document.getElementById('in-o3').value = '';
        document.getElementById('in-benar').value = '';
      });
    }

    function pilihTim(t) {
      timSaya = t;
      document.getElementById('btn-t1').classList.toggle('active', t === 1);
      document.getElementById('btn-t2').classList.toggle('active', t === 2);
    }

    function gabungRoom() {
      const code = document.getElementById('room-code').value.trim();
      if (!code || code.length < 3) { alert("Masukkan kode room minimal 3 angka!"); return; }
      
      roomID = "room_" + code;
      roomRef = db.ref('rooms/' + roomID);

      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      document.getElementById('lbl-room').innerText = code;
      
      const lblTim = document.getElementById('lbl-tim');
      lblTim.innerText = timSaya === 1 ? "NARUTO" : "SASUKE";
      lblTim.style.color = timSaya === 1 ? "#60a5fa" : "#f87171";

      const btns = document.querySelectorAll('.btn-ans');
      btns.forEach(b => b.className = `btn-ans ${timSaya === 1 ? 'ans-naruto' : 'ans-sasuke'}`);

      tampilkanSoal();
      inisiatisasiRoom();
    }

    function tampilkanSoal() {
      if (daftarSoal.length === 0) return;
      let s = daftarSoal[idxSoal % daftarSoal.length];
      document.getElementById('teks-soal').innerText = s.soal;
      document.getElementById('opt0').innerText = s.opsi[0] || "";
      document.getElementById('opt1').innerText = s.opsi[1] || "";
      document.getElementById('opt2').innerText = s.opsi[2] || "";
      document.getElementById('opt3').innerText = s.opsi[3] || "";
    }

    function inisiatisasiRoom() {
      roomRef.get().then((snapshot) => {
        if (!snapshot.exists()) {
          roomRef.set({ posisi: 50, waktu: 600 });
        }
        dengarkanServer();
      });
    }

    function dengarkanServer() {
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        document.getElementById('rope-group').style.left = data.posisi + "%";

        let m = Math.floor(data.waktu / 60); let s = data.waktu % 60;
        document.getElementById('waktu').innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);

        if (data.posisi <= 15) akhiriGame("🏆 TIM NARUTO MENANG!");
        else if (data.posisi >= 85) akhiriGame("🏆 TIM SASUKE MENANG!");
      });
    }

    function jawab(pilihan) {
      if (daftarSoal.length === 0) return;
      let s = daftarSoal[idxSoal % daftarSoal.length];
      let isBenar = (pilihan === s.jawaban);
      let power = 5;

      roomRef.child('posisi').transaction((posSekarang) => {
        if (posSekarang === null) return 50;
        if (isBenar) {
          return timSaya === 1 ? posSekarang - power : posSekarang + power;
        } else {
          return timSoy === 1 ? posSekarang + power : posSekarang - power;
        }
      });

      idxSoal++;
      tampilkanSoal();
    }

    function akhiriGame(pesan) {
      document.getElementById('teks-menang').innerText = pesan;
      document.getElementById('overlay-menang').style.display = "flex";
    }
  </script>
</body>
</html>
